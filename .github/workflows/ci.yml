name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run backend quality checks
        run: ./gradlew check

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  docker-compose-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        run: docker compose config

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test secret scanner
        run: node --test scripts/security/check-secrets.test.mjs

      - name: Scan repository for committed secrets
        run: node scripts/security/check-secrets.mjs

  full-stack-e2e:
    name: Full-stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend-test
      - frontend-check
      - docker-compose-config
      - security-check
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for application readiness
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness > /dev/null \
              && curl --fail --silent http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
        with:
          k6-version: "2.1.0"

      - name: Run performance smoke test
        env:
          BASE_URL: http://localhost:8080
          K6_PROFILE: smoke
        run: k6 run -e BASE_URL="$BASE_URL" -e K6_PROFILE="$K6_PROFILE" performance/game-record-flow.js

      - name: Run Playwright E2E
        working-directory: Frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report
            Frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop full stack
        if: always()
        run: docker compose down --volumes --remove-orphans
