spring:
  ai:
    model:
      chat: none
    mcp:
      server:
        enabled: true
  datasource:
    url: jdbc:h2:mem:billiards-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0

app:
  rate-limit:
    login-account-max-requests: 10000
    login-address-max-requests: 10000
    websocket-ticket-max-requests: 10000
    ai-generation-max-requests: 10000
