spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MILLIS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MILLIS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MILLIS:1800000}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    org.springframework.security: warn

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}
    refresh-cookie-secure: true
  admin-bootstrap:
    enabled: false
    email: ""

