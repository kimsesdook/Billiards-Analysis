spring:
  application:
    name: billiards
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  ai:
    retry:
      max-attempts: 1
    model:
      chat: ${AI_CHAT_MODEL:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
          temperature: 0.2
          max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}
          thinking-budget: ${GEMINI_THINKING_BUDGET:0}
    mcp:
      server:
        enabled: ${MCP_ENABLED:false}
        protocol: STREAMABLE
        name: billiards-report-mcp
        version: 1.0.0
        type: SYNC
        instructions: >
          Provide read-only billiards analysis data for the authenticated member.
          Use the returned statistics as factual grounding for analysis.
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [requestId=%X{requestId:-} traceId=%X{traceId:-} spanId=%X{spanId:-}] %logger{36} - %msg%n"

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    map-environment-variables: false
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment.name: ${SPRING_PROFILES_ACTIVE:local}
    tracing:
      sampler: parent-based-trace-id-ratio
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
        max-events: 64
        max-links: 16
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:5s}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

resilience4j:
  circuitbreaker:
    instances:
      gemini-ai:
        sliding-window-type: count-based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: ${AI_SLOW_CALL_DURATION:10s}
        wait-duration-in-open-state: ${AI_CIRCUIT_OPEN_DURATION:30s}
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      gemini-ai:
        timeout-duration: ${AI_CALL_TIMEOUT:20s}
        cancel-running-future: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-please-32bytes}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  websocket-ticket:
    expiration-seconds: ${WEBSOCKET_TICKET_EXPIRATION_SECONDS:30}
  rate-limit:
    login-account-max-requests: ${RATE_LIMIT_LOGIN_ACCOUNT_MAX_REQUESTS:5}
    login-address-max-requests: ${RATE_LIMIT_LOGIN_ADDRESS_MAX_REQUESTS:30}
    login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:300}
    websocket-ticket-max-requests: ${RATE_LIMIT_WEBSOCKET_TICKET_MAX_REQUESTS:30}
    websocket-ticket-window-seconds: ${RATE_LIMIT_WEBSOCKET_TICKET_WINDOW_SECONDS:60}
    ai-generation-max-requests: ${RATE_LIMIT_AI_GENERATION_MAX_REQUESTS:3}
    ai-generation-window-seconds: ${RATE_LIMIT_AI_GENERATION_WINDOW_SECONDS:86400}
  ai-report:
    model-name: ${GEMINI_MODEL:gemini-2.5-flash}
    lock-ttl-seconds: ${AI_REPORT_LOCK_TTL_SECONDS:180}
    lock-wait-seconds: ${AI_REPORT_LOCK_WAIT_SECONDS:5}
    lock-poll-interval-millis: ${AI_REPORT_LOCK_POLL_INTERVAL_MILLIS:100}
    executor-threads: ${AI_EXECUTOR_THREADS:4}
    executor-queue-capacity: ${AI_EXECUTOR_QUEUE_CAPACITY:8}
